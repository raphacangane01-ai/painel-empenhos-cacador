<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Empenhos por Fornecedor</title>
<style>
  :root {
    --azul: #0b3d62;
    --azul-claro: #eaf2f8;
    --verde: #1e8e5a;
    --laranja: #c76a1c;
    --cinza: #6b7280;
    --borda: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
  }
  header {
    background: var(--azul);
    color: white;
    padding: 20px 16px 0;
  }
  header h1 { margin: 0 0 4px; font-size: 1.25rem; }
  header p { margin: 2px 0; font-size: 0.85rem; opacity: 0.9; }
  .container { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 4px; margin-top: 16px; }
  .tab-btn {
    background: rgba(255,255,255,0.12);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px 8px 0 0;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.ativa { background: #f4f6f8; color: var(--azul); }
  .aba { display: none; }
  .aba.ativa { display: block; }
  .aviso {
    background: #fff7ed;
    border: 1px solid #fdba74;
    color: #9a5b13;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 14px;
    border: 1px solid var(--borda);
  }
  .card .label { font-size: 0.72rem; color: var(--cinza); text-transform: uppercase; letter-spacing: 0.03em; }
  .card .valor { font-size: 1.15rem; font-weight: 700; margin-top: 4px; }
  .card.material { border-top: 3px solid var(--azul); }
  .card.servico { border-top: 3px solid var(--laranja); }
  .card.veiculo { border-top: 3px solid var(--verde); }
  .secao-titulo {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 22px 0 10px;
    color: var(--azul);
  }
  .empenho, .veiculo {
    background: white;
    border: 1px solid var(--borda);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .empenho-cab, .veiculo-cab {
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    gap: 8px;
    flex-wrap: wrap;
  }
  .empenho-cab .titulo, .veiculo-cab .titulo { font-weight: 700; font-size: 0.9rem; }
  .tag {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .tag.material { background: var(--azul-claro); color: var(--azul); }
  .tag.servico { background: #fdf1e6; color: var(--laranja); }
  .tag.produto { background: #eafaf1; color: var(--verde); }
  .tag.pendente { background: #fee2e2; color: #b91c1c; }
  .item-lista { margin: 0; padding-left: 16px; color: var(--cinza); font-size: 0.75rem; }
  .item-lista li { margin: 1px 0; }
  .empenho-resumo, .veiculo-resumo { font-size: 0.78rem; color: var(--cinza); }
  .empenho-corpo, .veiculo-corpo { display: none; padding: 0 14px 14px; font-size: 0.82rem; }
  .empenho.aberto .empenho-corpo, .veiculo.aberto .veiculo-corpo { display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.78rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--borda); }
  th { color: var(--cinza); font-weight: 600; }
  .nf-lista { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .nf-chip {
    background: #f1f5f9;
    border: 1px solid var(--borda);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.72rem;
  }
  .pendente-item {
    background: white;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 0.82rem;
  }
  footer { text-align: center; padding: 20px; font-size: 0.72rem; color: var(--cinza); }
  .seta { transition: transform 0.15s; }
  .empenho.aberto .seta, .veiculo.aberto .seta { transform: rotate(180deg); }
</style>
</head>
<body>
<header>
  <h1 id="titulo-fornecedor">Carregando...</h1>
  <p id="subtitulo"></p>
  <p id="atualizado"></p>
  <div class="tabs">
    <button class="tab-btn ativa" id="tab-empenhos" onclick="mudarAba('empenhos')">Empenhos</button>
    <button class="tab-btn" id="tab-veiculos" onclick="mudarAba('veiculos')">Veiculos</button>
  </div>
</header>

<div class="container">

  <div class="aba ativa" id="aba-empenhos">
    <div class="aviso" id="aviso" style="display:none;"></div>
    <div class="cards" id="cards"></div>
    <div class="secao-titulo">Empenhos e notas fiscais</div>
    <div id="lista-empenhos"></div>
  </div>

  <div class="aba" id="aba-veiculos">
    <div class="aviso" id="aviso-pendentes" style="display:none;"></div>
    <div class="cards" id="cards-veiculos"></div>
    <div class="secao-titulo">Gasto por veiculo (Maxifrota)</div>
    <div id="lista-veiculos"></div>
    <div class="secao-titulo" id="titulo-pendentes" style="display:none;">Notas fiscais sem veiculo identificado</div>
    <div id="lista-pendentes"></div>
  </div>

  <footer>
    Saldo empenhado = soma das emissoes de empenho. Saldo gasto = soma das liquidacoes. Saldo disponivel = empenhado - gasto - anulado.
  </footer>
</div>

<script>
function moeda(v) {
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function dataBr(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR');
}

function classificar(elementoCodigo, elementoNome) {
  const nome = (elementoNome || '').toLowerCase();
  if (nome.includes('material')) return 'material';
  if (nome.includes('servi')) return 'servico';
  return 'outro';
}

function mudarAba(nome) {
  document.getElementById('aba-empenhos').classList.toggle('ativa', nome === 'empenhos');
  document.getElementById('aba-veiculos').classList.toggle('ativa', nome === 'veiculos');
  document.getElementById('tab-empenhos').classList.toggle('ativa', nome === 'empenhos');
  document.getElementById('tab-veiculos').classList.toggle('ativa', nome === 'veiculos');
}

fetch('./data.json')
  .then(r => r.json())
  .then(dados => {
    document.getElementById('titulo-fornecedor').textContent =
      dados.fornecedor.codigo + ' - ' + dados.fornecedor.nome;
    document.getElementById('subtitulo').textContent =
      dados.unidadeOrcamentaria + ' - ' + dados.orgaoOrcamentario;
    document.getElementById('atualizado').textContent =
      'Atualizado em ' + new Date(dados.atualizadoEm).toLocaleString('pt-BR');

    if (dados.observacao) {
      const av = document.getElementById('aviso');
      av.style.display = 'block';
      av.textContent = dados.observacao;
    }

    let totais = {
      material: { empenhado: 0, gasto: 0 },
      servico: { empenhado: 0, gasto: 0 }
    };

    const listaEl = document.getElementById('lista-empenhos');

    dados.empenhos.forEach(emp => {
      const classe = emp.classificacao || classificar(emp.elementoCodigo, emp.elementoNome);
      const gasto = emp.movimentacoes
        .filter(m => m.tipo.startsWith('Liquida'))
        .reduce((s, m) => s + m.valor, 0);

      if (totais[classe]) {
        totais[classe].empenhado += emp.valorEmpenhado;
        totais[classe].gasto += gasto;
      }

      const notas = new Map();
      emp.movimentacoes.forEach(m => (m.notasFiscais || []).forEach(nf => {
        notas.set(nf.numero, nf);
      }));

      const div = document.createElement('div');
      div.className = 'empenho';

      div.innerHTML =
        '<div class="empenho-cab" onclick="this.parentElement.classList.toggle(&quot;aberto&quot;)">' +
        '<div><div class="titulo">Empenho ' + emp.numero + ' <span class="tag ' + classe + '">' +
        (classe === 'material' ? 'Material' : classe === 'servico' ? 'Servico' : 'Outro') +
        '</span></div>' +
        '<div class="empenho-resumo">' + emp.especie + ' - ' + emp.elementoCodigo + ' - ' + emp.elementoNome +
        ' - Empenhado ' + moeda(emp.valorEmpenhado) + ' - Gasto ' + moeda(gasto) + '</div></div>' +
        '<span class="seta">v</span></div>' +
        '<div class="empenho-corpo">' +
        '<div><strong>Objeto:</strong> ' + (emp.objetoResumido || '-') + '</div>' +
        '<table><thead><tr><th>Data</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>' +
        emp.movimentacoes.map(function(m) {
          return '<tr><td>' + dataBr(m.data) + '</td><td>' + m.tipo + '</td><td>' + moeda(m.valor) + '</td></tr>';
        }).join('') +
        '</tbody></table>' +
        '<div style="margin-top:8px;"><strong>Notas fiscais vinculadas:</strong></div>' +
        '<div class="nf-lista">' +
        ([...notas.values()].map(function(nf) {
          return '<span class="nf-chip">NF ' + nf.numero + ' - ' + dataBr(nf.data) + ' - ' + moeda(nf.valor) + '</span>';
        }).join('') || '<span class="nf-chip">Nenhuma</span>') +
        '</div></div>';

      listaEl.appendChild(div);
    });

    const cardsEl = document.getElementById('cards');
    const linhas = [
      ['material', 'Empenhado - Material', totais.material.empenhado],
      ['material', 'Gasto - Material', totais.material.gasto],
      ['material', 'Disponivel - Material', totais.material.empenhado - totais.material.gasto],
      ['servico', 'Empenhado - Servico', totais.servico.empenhado],
      ['servico', 'Gasto - Servico', totais.servico.gasto],
      ['servico', 'Disponivel - Servico', totais.servico.empenhado - totais.servico.gasto],
    ];
    cardsEl.innerHTML = linhas.map(function(item) {
      var classe = item[0]; var label = item[1]; var valor = item[2];
      return '<div class="card ' + classe + '"><div class="label">' + label + '</div><div class="valor">' + moeda(valor) + '</div></div>';
    }).join('');
  })
  .catch(function(err) {
    document.getElementById('titulo-fornecedor').textContent = 'Erro ao carregar dados';
    console.error(err);
  });

fetch('./veiculos.json')
  .then(r => r.json())
  .then(dados => {
    const cardsEl = document.getElementById('cards-veiculos');
    cardsEl.innerHTML =
      '<div class="card veiculo"><div class="label">Total gasto (todos os veiculos)</div><div class="valor">' + moeda(dados.totalGeral) + '</div></div>' +
      '<div class="card veiculo"><div class="label">Veiculos com registro</div><div class="valor">' + dados.veiculos.length + '</div></div>';

    const listaEl = document.getElementById('lista-veiculos');
    dados.veiculos
      .slice()
      .sort(function(a, b) { return b.totalGasto - a.totalGasto; })
      .forEach(function(v) {
        const div = document.createElement('div');
        div.className = 'veiculo';
        div.innerHTML =
          '<div class="veiculo-cab" onclick="this.parentElement.classList.toggle(&quot;aberto&quot;)">' +
          '<div><div class="titulo">Placa ' + v.placa + '</div>' +
          '<div class="veiculo-resumo">' + v.qtdServicos + ' servico(s) - Total gasto ' + moeda(v.totalGasto) + '</div></div>' +
          '<span class="seta">v</span></div>' +
          '<div class="veiculo-corpo">' +
          '<table><thead><tr><th>Data</th><th>Oficina</th><th>NF</th><th>Tipo</th><th>Descricao</th><th>Valor</th></tr></thead><tbody>' +
          v.servicos.map(function(s) {
            const nfExibida = s.grupo && /^\d+$/.test(s.grupo) ? s.grupo : '-';
            const tipo = s.tipo === 'produto' ? 'Produto' : 'Servico';
            const tagClasse = s.tipo === 'produto' ? 'produto' : 'servico';
            let descricaoHtml = s.descricao || '-';
            if (s.itens && s.itens.length > 1) {
              descricaoHtml = '<ul class="item-lista">' +
                s.itens.map(function(i) { return '<li>' + i.descricao + ' - ' + moeda(i.valor) + '</li>'; }).join('') +
                '</ul>';
            }
            return '<tr><td>' + dataBr(s.data) + '</td><td>' + (s.oficina || '-') + '</td><td>' + nfExibida + '</td>' +
              '<td><span class="tag ' + tagClasse + '">' + tipo + '</span></td>' +
              '<td>' + descricaoHtml + '</td><td>' + moeda(s.valor) + '</td></tr>';
          }).join('') +
          '</tbody></table></div>';
        listaEl.appendChild(div);
      });

    if (dados.semVeiculo && dados.semVeiculo.length) {
      const av = document.getElementById('aviso-pendentes');
      av.style.display = 'block';
      av.textContent = dados.semVeiculo.length + ' nota(s) fiscal(is) ainda sem veiculo identificado, aguardando confirmacao.';

      document.getElementById('titulo-pendentes').style.display = 'block';
      const pendEl = document.getElementById('lista-pendentes');
      dados.semVeiculo.forEach(function(p) {
        const nfExibida = p.grupo && /^\d+$/.test(p.grupo) ? p.grupo : '-';
        const div = document.createElement('div');
        div.className = 'pendente-item';
        div.innerHTML =
          '<span class="tag pendente">Pendente</span> ' +
          '<strong>NF ' + nfExibida + '</strong> - ' + dataBr(p.data) + ' - ' + moeda(p.valor) +
          (p.oficina ? ' - ' + p.oficina : '') +
          '<div style="margin-top:4px; color:var(--cinza);">' + p.descricao + '</div>';
        pendEl.appendChild(div);
      });
    }
  })
  .catch(function(err) {
    console.error('Erro ao carregar veiculos.json', err);
  });
</script>
</body>
</html>
